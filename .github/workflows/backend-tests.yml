name: Backend Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master]

jobs:
  test-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno Tests
        run: |
          cd server
          deno test --allow-all supabase/functions/tests/
          
  test-api-bruno:
    runs-on: ubuntu-latest
    needs: test-edge-functions
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli
        
      - name: Run Bruno API Tests
        run: |
          cd docs/bruno_collection 
          bru run --env dev \
            --env-var supabaseUrl=${{ secrets.SUPABASE_URL }} \
            --env-var supabaseKey=${{ secrets.SUPABASE_KEY }}