stages:
  - test

# Запуск Unit-тестов Deno
deno-tests:
  stage: test
  image: denoland/deno:latest
  script:
    - cd server
    - deno test --allow-all supabase/functions/tests/
  only:
    - master
    - merge_requests

bruno-tests:
  stage: test
  image: node:20
  script:
    - npm install -g @usebruno/cli
    - cd docs/bruno_collection
    - bru run --env dev
  only:
    - master
    - merge_requests
