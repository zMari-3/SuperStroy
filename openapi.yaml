```yaml
openapi: 3.0.3
info:
  title: SuperStroy Backend API
  description: REST API для приложения фиксации строительных дефектов.
  version: 1.0.0
servers:
  - url: https://aqmvyfkpbvyrukuxniup.supabase.co/rest/v1
    description: Supabase REST API (Production)
  - url: https://aqmvyfkpbvyrukuxniup.supabase.co/functions/v1
    description: Supabase Edge Functions
  - url: https://aqmvyfkpbvyrukuxniup.supabase.co/storage/v1/object
    description: Supabase Storage
security:
  - BearerAuth: []

paths:
  /defects:
    get:
      summary: Получить список дефектов (с пагинацией)
      tags: [Defects]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED] }
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Defect' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Создать новый дефект
      tags: [Defects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefectCreate' }
      responses:
        '201':
          description: Создано
        '422':
          $ref: '#/components/responses/ValidationError'

  /defects:
    parameters:
      - name: id
        in: query
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Получить дефект по ID
      tags: [Defects]
      responses:
        '200':
          description: Найдено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Defect' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Обновить дефект
      tags: [Defects]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefectUpdate' }
      responses:
        '204':
          description: Обновлено
        '403':
          $ref: '#/components/responses/Forbidden'

  /defect-photos/{filename}:
    post:
      summary: Загрузить фотографию
      tags: [Storage]
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Загружено
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /recognize-speech:
    post:
      summary: Распознать речь (Edge Function)
      tags: [AI]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Успешное распознавание
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  parsed:
                    type: object
                    properties:
                      title: { type: string }
                      responsible: { type: string }
                      term: { type: string, format: date }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Defect:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        responsible: { type: string }
        term: { type: string, format: date }
        created_at: { type: string, format: date-time }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        photo_url: { type: string, format: uri }
        status: { type: string, enum: [OPEN, CLOSED] }

    DefectCreate:
      type: object
      required: [title, responsible, term, status]
      properties:
        title: { type: string, minLength: 3 }
        description: { type: string }
        responsible: { type: string }
        term: { type: string, format: date }
        latitude: { type: number }
        longitude: { type: number }
        photo_url: { type: string }
        status: { type: string, enum: [OPEN] }

    DefectUpdate:
      type: object
      properties:
        title: { type: string }
        responsible: { type: string }
        term: { type: string, format: date }
        status: { type: string, enum: [OPEN, CLOSED] }

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Нет доступа (RLS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Ошибка валидации данных
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Файл слишком большой
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }